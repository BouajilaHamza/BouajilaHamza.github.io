<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f17" />

    <title>
      {%- if page.title -%}{{ page.title }} · {{ site.title }}{%- else -%}{{ site.title }}{%- endif -%}
    </title>
    <meta
      name="description"
      content="{%- if page.description -%}{{ page.description | strip_newlines }}{%- else -%}{{ site.description | strip_newlines }}{%- endif -%}"
    />

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{%- if page.title -%}{{ page.title }} · {{ site.title }}{%- else -%}{{ site.title }}{%- endif -%}" />
    <meta
      property="og:description"
      content="{%- if page.description -%}{{ page.description | strip_newlines }}{%- else -%}{{ site.description | strip_newlines }}{%- endif -%}"
    />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <main id="content" class="page">
      {{ content }}
    </main>
  </body>
</html>
